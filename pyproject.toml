[project]
name = "apk-docforge"
dynamic = ["version"]
description = "Local-first Android APK documentation, provenance, and security analysis toolkit."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Alejandro J. Lamas" }]
keywords = ["android", "apk", "provenance", "security", "static-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "jsonschema>=4.23.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.20",
  "rich>=13.7.0",
  "sqlalchemy>=2.0.32",
  "typer>=0.12.3",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "respx>=0.21.1",
  "ruff>=0.8.0",
]

[project.scripts]
apk-docforge = "apk_docforge.cli:app"

[project.urls]
Repository = "https://github.com/alejandrojlamas/apk-docforge"
Issues = "https://github.com/alejandrojlamas/apk-docforge/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/apk_docforge/__init__.py"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
